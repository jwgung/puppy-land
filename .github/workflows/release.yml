# A v* tag builds the Play Store bundle (AAB, signed with the upload key), attaches it to a GitHub
# Release and uploads it to the Play closed-testing track "alpha" (job "play"; docs/release/README.md).
# The version comes from apps/lab3d/tools/build.sh play: versionCode = commits up to the tag,
# versionName = the tag (v0.1.1 -> 0.1.1). A manual run (workflow_dispatch) uploads an artifact only,
# and only when started on a v* tag (on any other ref the environment's deployment rule stops the job).
# The build must beat the versionCode of every earlier GitHub Release (Play rejects a lower one).
# Secrets live in the "play-release" Environment, not in the repository: UPLOAD_KEYSTORE_BASE64,
# UPLOAD_STORE_PASSWORD (the key's password is the same), alias "upload", and PLAY_SERVICE_ACCOUNT_JSON
# (a Play API service account; only the "play" job reads it). Its deployment rule allows
# v* tags only (docs/release/README.md, section 2). Third-party actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The build job only reads; the publish job alone may write (the Release).
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-release
    env:
      GODOT_DIR: ${{ github.workspace }}/.godot-bin
      TPZ_DIR: ${{ github.workspace }}/.godot-templates
    outputs:
      stem: ${{ steps.bundle.outputs.stem }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the commit count and the tags give the version
          persist-credentials: false
      - name: versionCode must beat every earlier release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(git rev-list --count HEAD)
          # Read the list first: a failed gh call must stop the build, not look like "no release yet".
          titles=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name -q '.[].name') \
            || { echo "::error::could not list the earlier releases"; exit 1; }
          # Release titles end in "(puppy-land-<name>-v<code>)". The newest 200 releases are read;
          # widen --limit if there are ever more. The count is the same one build.sh uses.
          last=$(printf '%s\n' "$titles" | sed -n 's/.*-v\([0-9][0-9]*\))$/\1/p' | sort -n | tail -n 1)
          # Releases exist but none carries a code: the title format changed, so the check would be blind.
          if [ -n "$titles" ] && [ -z "$last" ]; then
            echo "::error::no earlier release title ends in -v<code>); fix this check or the title in the publish job."
            exit 1
          fi
          last=${last:-0}
          [ "$code" -gt "$last" ] || { echo "::error::versionCode $code is not above the last release's $last, and Play rejects it. Build from a newer commit."; exit 1; }
          echo "versionCode $code (last release: $last)"
          echo "GUARD_CODE=$code" >> "$GITHUB_ENV" # the bundle step checks the built code against this
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      # Only the official release files are cached; the install scripts re-verify their pinned SHA-512
      # on every run, so a cache entry cannot change what is used.
      - name: Cache Godot release files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.GODOT_DIR }}/Godot_v4.7.2-stable_linux.x86_64.zip
            ${{ env.TPZ_DIR }}/Godot_v4.7.2-stable_export_templates.tpz
          key: godot-4.7.2-stable-release-${{ hashFiles('.github/scripts/install-godot.sh', '.github/scripts/install-godot-templates.sh') }}
      - name: Install Godot 4.7.2 and its Android templates (official release, SHA-512 checked)
        run: |
          echo "GODOT=$(.github/scripts/install-godot.sh "$GODOT_DIR")" >> "$GITHUB_ENV"
          .github/scripts/install-godot-templates.sh "$TPZ_DIR"
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Tests (a bundle is never built from a commit that fails them)
        run: apps/lab3d/tools/build.sh test
      # Decoded right before the build, so the tests above (which run repository scripts) never see the key.
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$UPLOAD_KEYSTORE_BASE64" ] || { echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is missing: a bundle without the upload key cannot go to the Play Store."; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Play bundle
        id: bundle
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: upload
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          apps/lab3d/tools/build.sh play | tee "$RUNNER_TEMP/play.log"
          read -r _ name code < <(grep '^play: ' "$RUNNER_TEMP/play.log" | tail -1)
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error::no version in the build output"; exit 1; }
          [ "$code" = "$GUARD_CODE" ] || { echo "::error::built versionCode $code differs from the checked $GUARD_CODE (build.sh and the check disagree)"; exit 1; }
          stem="puppy-land-${name}-v${code}"
          mkdir -p out
          cp "apps/lab3d/exports/android/${stem}.aab" out/
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          ls -l out
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.bundle.outputs.stem }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Only a tag push makes a Release; a manual run (also on a tag) stops at the artifact.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ needs.bundle.outputs.stem }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME ($STEM)" --generate-notes

  # Uploads the bundle on the Release to the closed-testing track. Needs its own approval of the
  # "play-release" Environment, which holds the service-account key; the Release already exists, so
  # a failure here (e.g. a rejected release) is fixed in the Play Console or by a new tag.
  play:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [bundle, publish]
    runs-on: ubuntu-latest
    environment: play-release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # to compare with the previous tag
          sparse-checkout: docs/release/whatsnew
          persist-credentials: false
      - name: Release notes were edited
        run: |
          # The first release has no earlier tag, so there is nothing to compare with.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          [ -n "$prev" ] || echo "::notice::no earlier v* tag; release notes not compared"
          if [ -n "$prev" ] && git diff --quiet "$prev" "$GITHUB_REF_NAME" -- docs/release/whatsnew; then
            echo "::error::docs/release/whatsnew is unchanged since $prev, so last release's notes would go out again. Edit them and tag the new commit."
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: jwgung.puppyland
          releaseFiles: out/*.aab
          track: alpha
          status: completed
          whatsNewDirectory: docs/release/whatsnew
